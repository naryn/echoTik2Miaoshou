<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MX POP 跨境直邮定价工具</title><link rel="stylesheet" href="/pricing-assets/pricing.css"></head><body><main><header><div><h1>跨境直邮定价工具</h1><p>所有结果由 Python 后端实时计算</p></div><span>2026-10-21 价卡</span></header><nav><button class="active" data-tab="quote">正向定价</button><button data-tab="reverse">反推成本</button><button data-tab="weight">体积重检查</button></nav><section id="quote" class="tab active"><div class="intro"><h2>正向定价</h2><small>商品成本 RMB → 定价、固定成本、毛利与净利</small></div><div class="layout"><form data-api="/v1/pricing/crossborder/quote"><h3>输入参数</h3><fieldset><legend>商品成本与汇率</legend><label>商品成本（RMB）<input name="product_cost_rmb" type="number" value="15" step=".01"></label><label>境内附加成本（RMB）<input name="domestic_extra_cost_rmb" type="number" value="2" step=".01"></label><label>汇率（1 RMB = ? MXN）<input name="mxn_per_rmb" type="number" value="2.78" step=".01"></label></fieldset><fieldset><legend>订单与定价条件</legend><label>每单件数<input name="quantity" type="number" value="1" min="1"></label><label>单件计费重量（kg）<input name="unit_chargeable_weight_kg" type="number" value=".2" step=".01"></label><label>目标净利率（%）<input name="target_net_margin_pct" type="number" value="20"></label><label>商家折扣率（%）<input name="merchant_discount_pct" type="number" value="50"></label><label>新客折扣率（%）<input name="new_customer_discount_pct" type="number" value="0"></label><label>达人佣金（%）<input name="affiliate_commission_pct" type="number" value="0"></label><label>广告投入（%）<input name="advertising_pct" type="number" value="0"></label></fieldset><button>计算定价</button></form><div class="result"><div class="hero"><span>建议单件上新原价</span><b id="unitList">—</b><small id="saleRef"></small></div><div class="stats"><article><span>整单折后售价</span><b id="sale">—</b></article><article><span>固定成本</span><b id="fixed">—</b></article><article><span>毛利率</span><b id="grossMargin">—</b></article><article><span>净利率</span><b id="netMargin">—</b></article></div><h3>利润结构（整单）</h3><table><thead><tr><th>项目</th><th>MXN</th><th>RMB</th></tr></thead><tbody id="profitRows"></tbody></table><p class="error" id="quoteError"></p></div></div></section><section id="reverse" class="tab"><div class="intro"><h2>反推采购成本</h2></div><div class="layout"><form data-api="/v1/pricing/crossborder/reverse-cost"><h3>输入参数</h3><fieldset><legend>售价与订单</legend><label>整单折后售价（MXN）<input name="sale_price_mxn" type="number" value="42"></label><label>每单件数<input name="quantity" type="number" value="1"></label><label>单件计费重量（kg）<input name="unit_chargeable_weight_kg" type="number" value=".62" step=".01"></label></fieldset><fieldset><legend>目标与费率</legend><label>目标净利率（%）<input name="target_net_margin_pct" type="number" value="10"></label><label>商家折扣率（%）<input name="merchant_discount_pct" type="number" value="50"></label><label>达人佣金（%）<input name="affiliate_commission_pct" type="number" value="10"></label><label>广告投入（%）<input name="advertising_pct" type="number" value="0"></label><label>汇率<input name="mxn_per_rmb" type="number" value="2.78"></label></fieldset><button>反推成本</button></form><div class="result"><div class="hero"><span>可承受单件商品成本</span><b id="maxCost">—</b><small id="maxCostRmb"></small></div><h3>费用明细</h3><table><tbody id="reverseRows"></tbody></table><p class="error" id="reverseError"></p></div></div></section><section id="weight" class="tab"><div class="intro"><h2>体积重检查</h2></div><div class="layout"><form data-api="/v1/pricing/chargeable-weight"><h3>包装数据</h3><fieldset><label>长度（cm）<input name="length_cm" type="number" value="25"></label><label>宽度（cm）<input name="width_cm" type="number" value="10"></label><label>高度（cm）<input name="height_cm" type="number" value="20"></label><label>实际重量（kg）<input name="actual_weight_kg" type="number" value=".3" step=".01"></label></fieldset><button>检查重量</button></form><div class="result"><div class="hero"><span>应输入定价工具的重量</span><b id="chargeable">—</b><small id="bubble"></small></div></div></div></section></main><script src="/pricing-assets/pricing.js"></script></body></html>
